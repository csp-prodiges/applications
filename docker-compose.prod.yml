services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  site-vitrine:
    build:
      context: ./site-vitrine
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_INTRANET_URL: "http://${PUBLIC_IP}:8085"
    depends_on:
      - backend
    ports:
      - "8084:80"
    restart: unless-stopped

  intranet:
    build:
      context: ./intranet
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_SITE_URL: "http://${PUBLIC_IP}:8084"
    depends_on:
      - backend
    ports:
      - "8085:80"
    restart: unless-stopped

volumes:
  pgdata:
