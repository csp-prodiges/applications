services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      network: host
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Servi derrière le nginx existant du VPS (déjà sur 80/443) via des chemins
  # /csp/ et /csp-intranet/ — pas de nouveau port public à ouvrir côté OVH.
  # N'écoute que sur 127.0.0.1, comme les autres apps déjà déployées sur ce VPS.
  site-vitrine:
    build:
      context: ./site-vitrine
      dockerfile: Dockerfile.prod
      network: host
      args:
        VITE_BASE_PATH: "/csp/"
        VITE_API_URL: "/csp"
        VITE_INTRANET_URL: "http://${PUBLIC_IP}/csp-intranet/"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8084:80"
    restart: unless-stopped

  intranet:
    build:
      context: ./intranet
      dockerfile: Dockerfile.prod
      network: host
      args:
        VITE_BASE_PATH: "/csp-intranet/"
        VITE_API_URL: "/csp-intranet"
        VITE_SITE_URL: "http://${PUBLIC_IP}/csp/"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped

volumes:
  pgdata:
