services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      network: host
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Servi derrière le nginx existant du VPS (sef-nginx, sur 80/443) via des
  # sous-domaines nip.io dédiés (routage par server_name/SNI, comme les autres
  # apps du VPS) — n'écoute que sur 127.0.0.1, pas de nouveau port public.
  site-vitrine:
    build:
      context: ./site-vitrine
      dockerfile: Dockerfile.prod
      network: host
      args:
        VITE_API_URL: ""
        VITE_INTRANET_URL: "https://${INTRANET_DOMAIN}"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8084:80"
    restart: unless-stopped

  intranet:
    build:
      context: ./intranet
      dockerfile: Dockerfile.prod
      network: host
      args:
        VITE_API_URL: ""
        VITE_SITE_URL: "https://${SITE_DOMAIN}"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped

volumes:
  pgdata:
