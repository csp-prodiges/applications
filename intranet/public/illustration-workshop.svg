  <!-- three kids seated around table -->
  <g transform="translate(150,275)">
    <path d="M-24 62 C-24 30 -14 8 0 8 C14 8 24 30 24 62 L24 78 L-24 78 Z" fill="#E63946"/>
    <circle cx="0" cy="-8" r="18" fill="#3D1856"/>
