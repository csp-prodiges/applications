  <rect x="40" y="24" width="16" height="36" fill="#E63946"/>
  <rect x="58" y="18" width="16" height="42" fill="#D9A62E"/>
  <rect x="76" y="28" width="16" height="32" fill="#2B7FD6"/>
  <rect x="94" y="14" width="16" height="46" fill="#3FA64B"/>
